# Mistral Ministral-3-3B-Reasoning-2512: dedicated thinking checkpoint
# Official sampling: temperature=0.7, top_p=0.95.
# The vendor requires its SYSTEM_PROMPT.txt in front of the system prompt to reliably enter [THINK] reasoning:
# system_prompt_prefix_json holds the structured system message equivalent to the official load_system_prompt();
# the system prompt of each AgentIF instruction is appended after it.
backend: vllm
model_name: Ministral-3-3B-Reasoning-2512
model_path: ${MODELS_DIR}/Ministral-3-3B-Reasoning-2512
served_model_name: Ministral-3-3B-Reasoning-2512
model_type: thinking_only
default_mode: thinking
tensor_parallel_size: 1
max_model_len: 65536
system_prompt_prefix_json: configs/assets/ministral_reasoning_system_prompt.json
vllm_args:
  - --dtype bfloat16
  - --gpu-memory-utilization 0.85
  - --max-num-seqs 64
  - --tokenizer-mode mistral
  - --config-format mistral
  - --load-format mistral
  - --reasoning-parser mistral
  - --limit-mm-per-prompt '{"image":0}'
modes:
  thinking:
    temperature: 0.7               # official recommendation
    top_p: 0.95
    max_tokens: 32768
