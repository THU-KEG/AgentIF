# Tencent Hunyuan-4B-Instruct (hybrid, slow-thinking by default)
# Output format is <think>..</think><answer>..</answer>; the hunyuan_a13b reasoning parser extracts the answer.
# Official sampling: temperature=0.7, top_p=0.8, top_k=20, repetition_penalty=1.05 (same for both modes).
backend: vllm
model_name: Hunyuan-4B-Instruct
model_path: ${MODELS_DIR}/Hunyuan-4B-Instruct
served_model_name: Hunyuan-4B-Instruct
model_type: hybrid
default_mode: thinking
tensor_parallel_size: 1
max_model_len: 65536
vllm_args:
  - --dtype bfloat16
  - --gpu-memory-utilization 0.85
  - --max-num-seqs 64
  - --reasoning-parser hunyuan_a13b
modes:
  thinking:
    enable_thinking: true
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    repetition_penalty: 1.05
    max_tokens: 32768
  non_thinking:
    enable_thinking: false
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    repetition_penalty: 1.05
    max_tokens: 16384
