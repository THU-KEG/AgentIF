# Qwen3.5-2B (hybrid; unlike the 4B model it is non-thinking by default)
# Official sampling (text tasks):
#   non-thinking: T=1.0, top_p=1.0,  top_k=20, min_p=0, presence_penalty=2.0, repetition_penalty=1.0
#   thinking:     T=1.0, top_p=0.95, top_k=20, min_p=0, presence_penalty=1.5, repetition_penalty=1.0
backend: vllm
model_name: Qwen3.5-2B
model_path: ${MODELS_DIR}/Qwen3.5-2B
served_model_name: Qwen3.5-2B
model_type: hybrid
default_mode: non_thinking
tensor_parallel_size: 1
max_model_len: 262144              # default of the official serve command
vllm_args:
  - --dtype bfloat16
  - --gpu-memory-utilization 0.85
  - --max-num-seqs 64
  - --reasoning-parser qwen3
  - --language-model-only
modes:
  thinking:
    enable_thinking: true
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    max_tokens: 32768
  non_thinking:
    enable_thinking: false
    temperature: 1.0
    top_p: 1.0
    top_k: 20
    min_p: 0.0
    presence_penalty: 2.0
    repetition_penalty: 1.0
    max_tokens: 16384
